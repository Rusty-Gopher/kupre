# Planted hazards for the README recordings. Apply to a disposable cluster:
#   kind create cluster --name kupre-demo --image kindest/node:v1.36.4
#   kubectl apply -f docs/demo/fixtures.yaml
apiVersion: v1
kind: Namespace
metadata: {name: shop}
---
# Single replica behind a PDB that allows zero evictions: blocks node drain.
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: checkout}}
  template:
    metadata: {labels: {app: checkout}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: checkout, namespace: shop}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: checkout}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: payments, namespace: shop}
spec:
  replicas: 2
  selector: {matchLabels: {app: payments}}
  template:
    metadata: {labels: {app: payments}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources: {requests: {cpu: 10m, memory: 16Mi}}
---
# Crash-looping container.
apiVersion: apps/v1
kind: Deployment
metadata: {name: recommender, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: recommender}}
  template:
    metadata: {labels: {app: recommender}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo boom; exit 1"]
          resources: {requests: {cpu: 10m, memory: 16Mi}}
---
# Image that cannot be pulled.
apiVersion: apps/v1
kind: Deployment
metadata: {name: search, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: search}}
  template:
    metadata: {labels: {app: search}}
    spec:
      containers:
        - name: app
          image: registry.example.invalid/search:2.4.1
          resources: {requests: {cpu: 10m, memory: 16Mi}}
---
# Routes served by the retired ingress-nginx controller.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata: {name: nginx}
spec: {controller: k8s.io/ingress-nginx}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: storefront, namespace: shop}
spec:
  ingressClassName: nginx
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: storefront, port: {number: 80}}}
