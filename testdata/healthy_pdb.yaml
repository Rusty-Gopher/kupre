# A PodDisruptionBudget with headroom: one pod can be evicted at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coredns
  namespace: kube-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      k8s-app: kube-dns
status:
  observedGeneration: 1
  expectedPods: 2
  currentHealthy: 2
  desiredHealthy: 1
  disruptionsAllowed: 1
