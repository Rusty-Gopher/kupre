# A webhook that never learned to speak AdmissionReview v1, which has been the
# only supported version since 1.22. The API server cannot call it at all, and
# with failurePolicy=Fail every matching request is rejected.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: legacy-validator
webhooks:
  - name: validate.legacy.example.invalid
    admissionReviewVersions: ["v1beta1"]
    failurePolicy: Fail
    sideEffects: None
    timeoutSeconds: 30
    clientConfig:
      service:
        name: legacy-webhook
        namespace: legacy
        path: /validate
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
