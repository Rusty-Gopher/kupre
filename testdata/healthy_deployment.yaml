# A Deployment at its desired state whose containers declare resource requests.
# Neither rollouts-stuck nor missing-resource-requests should report it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: storefront
          image: registry.invalid/storefront:3.0
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
status:
  replicas: 2
  readyReplicas: 2
  conditions:
    - type: Progressing
      status: "True"
      reason: NewReplicaSetAvailable
