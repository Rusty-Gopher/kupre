name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          out=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          if [ -n "$out" ]; then echo "needs gofmt:"; echo "$out"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Verify dependencies are tidy
        run: go mod tidy -diff

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

      # kupre is read-only by construction. This guards the property in CI so a
      # mutating call cannot be introduced unnoticed.
      - name: Assert no mutating Kubernetes calls
        run: |
          if grep -rnE '\.(Create|Update|Delete|Patch|Apply|DeleteCollection|UpdateStatus)\(' \
               --include='*.go' pkg/ cmd/ \
               | grep -v '_test.go' | grep -v 'spinner.Update' | grep -v 'os\.Create('; then
            echo "found a mutating client call - kupre must remain read-only"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./cmd/kupre/

  # End to end against real API servers: discovery, RBAC, pagination and exit
  # codes as users see them. One job per supported Kubernetes minor.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [v1.35.8, v1.36.4, v1.37.0]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: helm/kind-action@v1
        with:
          # The action's default kind writes kubeadm v1beta3 configs, which
          # kubeadm 1.37 rejects; v0.32.0 is verified to boot 1.37.
          version: v0.32.0
          node_image: kindest/node:${{ matrix.node }}
          cluster_name: kupre-it
          wait: 180s
      - name: Integration tests
        run: KUBECONFIG="$HOME/.kube/config" make integration

  # Exercises action.yml exactly as users call it, against a kind cluster.
  action:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # source: this commit's code. latest: the published release download.
        install: [source, latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: helm/kind-action@v1
        with:
          version: v0.32.0
          node_image: kindest/node:v1.36.4
          cluster_name: kupre-action-${{ matrix.install }}
          wait: 180s
      - id: kupre
        uses: ./
        with:
          version: ${{ matrix.install }}
          target-version: 1.37.0
          fail-on: never
      - name: Outputs are set
        env:
          VERDICT: ${{ steps.kupre.outputs.verdict }}
          REPORT: ${{ steps.kupre.outputs.report }}
        run: |
          echo "verdict=$VERDICT"
          case "$VERDICT" in ready|warnings|blocked) ;; *) exit 1 ;; esac
          test -s "$REPORT"
