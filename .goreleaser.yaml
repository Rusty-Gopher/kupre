# kupre release configuration. Validated against GoReleaser v2 (July 2026).
# Dormant until a v* tag is pushed; test locally with:
#   goreleaser check
#   goreleaser release --snapshot --clean
version: 2

project_name: kupre

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/kupre
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    # Reproducible builds: stamp the commit time, not the build time.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  # The release workflow attests this exact file; every artifact listed in it
  # is covered by one attestation.
  name_template: "checksums.txt"

# Keyless cosign signature over the checksums file, which covers every
# archive. Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/Rusty-Gopher/kupre/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "--yes", "${artifact}"]

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # v0 already says "unstable"; -beta/-rc tags additionally get the GitHub
  # pre-release badge automatically.
  prerelease: auto
  draft: true # first releases deserve hand-written notes; publish after editing

# Multi-arch image for in-cluster use (CronJob, Argo, Tekton). Distroless,
# non-root; the binary is the same one shipped in the archives.
dockers_v2:
  - images:
      - ghcr.io/rusty-gopher/kupre
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true
    labels:
      org.opencontainers.image.title: kupre
      org.opencontainers.image.description: Kubernetes upgrade preflight, health check and certificate audit
      org.opencontainers.image.source: https://github.com/Rusty-Gopher/kupre
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT

# Homebrew cask and krew manifest, both published to Rusty-Gopher/homebrew-tap
# (one repo: Casks/ for brew, plugins/ as a krew index). Inert until the
# TAP_DEPLOY_KEY secret holds the private half of a write deploy key on that
# repo; without it both files are generated in dist/ but not pushed.
#   brew install rusty-gopher/tap/kupre
#   kubectl krew index add rusty-gopher https://github.com/Rusty-Gopher/homebrew-tap
#   kubectl krew install rusty-gopher/kupre
homebrew_casks:
  - name: kupre
    homepage: https://github.com/Rusty-Gopher/kupre
    description: Kubernetes upgrade preflight, health check and certificate audit
    license: MIT
    binaries: [kupre]
    repository: &tap
      owner: Rusty-Gopher
      name: homebrew-tap
      git:
        url: git@github.com:Rusty-Gopher/homebrew-tap.git
        private_key: '{{ envOrDefault "TAP_DEPLOY_KEY" "" }}'
    skip_upload: &tapskip '{{ if eq (envOrDefault "TAP_DEPLOY_KEY" "") "" }}true{{ else }}auto{{ end }}'
    commit_msg_template: "kupre {{ .Tag }}"
    # Release binaries are not notarized; clear quarantine so macOS runs them.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kupre"]
          end

krews:
  - name: kupre
    homepage: https://github.com/Rusty-Gopher/kupre
    short_description: Upgrade preflight, health check and certificate audit
    description: |
      Read-only Kubernetes upgrade preflight, health check and certificate
      audit. Run "kubectl kupre check --target-version 1.37.0" for an ordered
      worklist of what blocks the upgrade, with the exact fix for each item.
    repository: *tap
    skip_upload: *tapskip
    commit_msg_template: "kupre {{ .Tag }} (krew)"
